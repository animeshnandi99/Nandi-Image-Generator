openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: images
    description: Image generation operations
  - name: chat
    description: LLM chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /images/generate:
    post:
      operationId: generateImage
      tags: [images]
      summary: Generate an image from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationInput"
      responses:
        "200":
          description: Generated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/enhance-prompt:
    post:
      operationId: enhancePrompt
      tags: [chat]
      summary: Use LLM to enhance an image generation prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnhancePromptInput"
      responses:
        "200":
          description: Enhanced prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnhancePromptResult"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ImageGenerationInput:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          minLength: 1
        size:
          type: string
          enum: ["1024x1024", "1536x1024", "1024x1536"]
          default: "1024x1024"
        style:
          type: ["string", "null"]

    GeneratedImage:
      type: object
      required:
        - id
        - prompt
        - b64_json
        - mime_type
        - size
        - createdAt
      properties:
        id:
          type: string
        prompt:
          type: string
        b64_json:
          type: string
        mime_type:
          type: string
        size:
          type: string
        style:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    EnhancePromptInput:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          minLength: 1

    EnhancePromptResult:
      type: object
      required:
        - enhancedPrompt
        - original
      properties:
        enhancedPrompt:
          type: string
        original:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
